<h2 mat-dialog-title>{{ titre }}</h2>

<mat-dialog-content>
  <div class="chargement" *ngIf="chargement">
    <mat-spinner diameter="28"></mat-spinner>
  </div>

  <p class="envoyeur">
    Envoyé par <strong>{{ envoi.expediteur?.prenom || envoi.expediteur?.email }}</strong>
    <span class="mot" *ngIf="envoi.message">— « {{ envoi.message }} »</span>
  </p>

  <table class="comparaison" *ngIf="!chargement">
    <thead>
      <tr>
        <th class="champ"></th>
        <th>Fiche reçue</th>
        <th *ngIf="envoi.doublon">Votre fiche actuelle</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let ligne of lignes" [class.differe]="envoi.doublon && ligne.differe">
        <th class="champ">{{ ligne.libelle }}</th>
        <td>
          <app-rich-text-view *ngIf="ligne.riche; else brutRecu" [html]="ligne.recu"></app-rich-text-view>
          <ng-template #brutRecu>{{ ligne.recu || '—' }}</ng-template>
        </td>
        <td *ngIf="envoi.doublon">
          <app-rich-text-view *ngIf="ligne.riche; else brutActuel" [html]="ligne.actuel"></app-rich-text-view>
          <ng-template #brutActuel>{{ ligne.actuel || '—' }}</ng-template>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="images" *ngIf="imagesRecues().length">
    <div class="titre-images">Images reçues</div>
    <img *ngFor="let img of imagesRecues()" [src]="img" alt="Illustration reçue" />
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="decider('refuser')">Refuser</button>
  <button mat-button (click)="fermer()">Décider plus tard</button>
  <button mat-stroked-button color="warn" *ngIf="envoi.doublon" (click)="decider('remplacer')">
    <mat-icon>swap_horiz</mat-icon>
    Remplacer la mienne
  </button>
  <button mat-flat-button color="primary" (click)="decider('garder-les-deux')">
    <mat-icon>check</mat-icon>
    {{ envoi.doublon ? 'Garder les deux' : 'Accepter' }}
  </button>
</mat-dialog-actions>

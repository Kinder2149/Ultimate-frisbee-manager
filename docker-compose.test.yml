# Base PostgreSQL dediee aux tests automatises.
#
# Isolee de la production : port 5433, identifiants locaux, donnees
# ephemeres (aucun volume persistant — tout disparait a l'arret).
#
#   Demarrer : docker compose -f docker-compose.test.yml up -d
#   Arreter  : docker compose -f docker-compose.test.yml down
#
# Les tests la reinitialisent a chaque execution : ne jamais y placer
# de donnees a conserver.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: ufm-postgres-test
    environment:
      POSTGRES_USER: ufm_test
      POSTGRES_PASSWORD: ufm_test
      POSTGRES_DB: ufm_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufm_test -d ufm_test"]
      interval: 3s
      timeout: 3s
      retries: 20
